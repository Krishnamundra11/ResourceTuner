# LLM routing for the agentic components (Step 8). Hand-maintained.
# Keys come from the environment / .env (never from this file).
#
# Chains (decided 2026-10-22):
#   diagnostic (CrewAI CPU/RAM/IO agents): Groq -> OpenRouter free x2 -> Ollama
#   adk        (Supervisor/Decision/Meta): Gemini -> Groq -> Ollama          (wired in Step 8b)
# Measured 2026-10-22: OpenRouter free tier = 50 requests/day across ALL free models (GET /api/v1/key);
# Groq gpt-oss-120b = 1000 requests, 8000 tokens/min (response headers).
# Only Ollama is "degraded": its results are flagged, and the Meta-Agent must not promote
# policies from them. Every attempt is logged to data/llm_calls.jsonl with provider + model.

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    structured_modes: [json_schema]          # require_parameters routes only to endpoints that support it
    extra_body:
      provider: {require_parameters: true}
      plugins: [{id: response-healing}]
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    structured_modes: [json_schema, json_object]   # json_schema to be verified live; else json_object + Pydantic
  gemini:
    api_key_env: GOOGLE_API_KEY              # this "AQ." key works in AI Studio mode, NOT Vertex (401 there)
  ollama:
    # 2026-10-24: runs on the Windows HOST (qwen2.5:3b), reached over the VirtualBox host-only network
    # (VM 192.168.56.101 -> host 192.168.56.1). Running it inside the VM held the VM at ~99% CPU for
    # 75 s per diagnosis — i.e. it made the very contention it was diagnosing worse.
    base_url_env: OLLAMA_BASE_URL            # .env: http://192.168.56.1:11434 (not the NAT 10.0.2.2)
    base_url_default: http://192.168.56.1:11434
    base_url_suffix: /v1                     # Ollama's OpenAI-compatible endpoint
    api_key: ollama                          # Ollama ignores it, the OpenAI client needs a value
    structured_modes: [json_schema, json_object]
    degraded: true
    connect_timeout_s: 3                     # host down/unreachable -> fail in 3 s, breaker skips it
    timeout_s: 60                            # measured on the host 2026-10-24: 8.5-18.4 s per diagnosis (~3x margin)

chains:
  diagnostic:
    # Order changed 2026-10-22 (user): Groq first (3 s, json_schema verified, 1000 req/day),
    # then the free OpenRouter models (50 req/day in total, ~25 s), then local Ollama (degraded).
    # xing4.0 removed: wrong arithmetic in the probe and upstream 429s.
    # All are reasoning models: their thinking counts against max_tokens, so ask for low effort.
    - {provider: groq, model: openai/gpt-oss-120b, extra_body: {reasoning_effort: low}}
    - {provider: openrouter, model: nvidia/nemotron-3.5-super-vl:free, extra_body: {reasoning: {effort: low}}}
    - {provider: openrouter, model: nvidia/nemotron-3-super-120b-a12b:free, extra_body: {reasoning: {effort: low}}}  # 404 upstream now; breaker skips it
    - {provider: ollama, model: qwen2.5:3b}

  adk:
    # ADK agents keep their own native Gemini model (step 1, named per agent in `adk_models` below);
    # resourcetuner/agents/adk/model_plugin.py adds the breaker, the fallbacks (steps 2+, called through
    # ADK's LiteLlm) and the call log. The model name here is only the default for the breaker key.
    - {provider: gemini, model: gemini-3.5-flash-lite}
    - {provider: groq, model: openai/gpt-oss-120b, litellm: groq/openai/gpt-oss-120b, extra: {reasoning_effort: low}}
    - {provider: ollama, model: qwen2.5:3b, litellm: ollama_chat/qwen2.5:3b}

# Gemini model per ADK agent (user decision 2026-10-24). Names live here, never in code.
# NO max_output_tokens on Gemini agents: these are thinking models and a small cap swallows the whole
# answer (measured: gemini-3.5-flash with max_output_tokens=20 returned an empty string).
adk_models:
  supervisor: gemini-3.5-flash-lite
  decision: gemini-3.6-flash
  meta: gemini-3.6-flash

circuit_breaker:
  rate_limit_cooldown_s: 60        # 429 without a daily-quota signal (or Retry-After, whichever is larger)
  daily_quota_cooldown_s: 21600    # 429 that says the daily/free quota is used up: skip for 6 h
  max_cooldown_s: 86400
  error_cooldown_s: 30             # network error / 5xx: skip the provider briefly
  unavailable_cooldown_s: 1800     # 404 (model gone upstream) -> skip that model; 401/403 (key) -> skip provider
  state_file: data/llm_breaker.json  # persisted, so a new run does not re-hit an exhausted quota

request:
  timeout_s: 60
  temperature: 0.1
  max_tokens: 4000    # 1200 truncated Groq/Nemotron mid-JSON ("max completion tokens reached")

diagnostic_crew:
  # Groq allows 8000 tokens/min; one diagnosis is ~2-3k tokens. Run the CPU/RAM/IO agents one after
  # another with a gap instead of all at once, so a full round stays inside that budget.
  agent_gap_s: 20
