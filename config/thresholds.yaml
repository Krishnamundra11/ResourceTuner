# ResourceTuner thresholds — calibrated in Step 4.
# Generated by scripts/calibrate_thresholds.py on 2026-10-07 from data/telemetry_log.jsonl
# (sessions: cal-20261007). Full methodology and tables:
# docs/step4_calibration.md. Units: CPU in percent of one core (100 = one core) unless noted;
# PSI values are /proc/pressure 'some avg10' percentages.
# Rule: separable -> midpoint(negative p99, positive p5); otherwise max Youden J.
# Negatives = idle + uncontended single-workload samples. CPU positives = designed CPU demand > vCPUs;
# I/O and memory positives = medium/high runs of that resource's scenarios.

contention:
  cpu:
    psi_some_avg10: 15.6   # PRIMARY trigger. midpoint of negative p99 (7.5) and positive p5 (23.6); FPR 0.00, TPR 0.99
    # No utilization threshold: CPU % does not separate contended from uncontended load
    # (overlapping distributions: max Youden J = 0.92, FPR 0.09 at 28%: an uncontended build already runs ~70%).
  io:
    psi_some_avg10: 18.4   # midpoint of negative p99 (2.7) and positive p5 (34.0); FPR 0.00, TPR 1.00
    iowait_percent: 10.9   # supporting evidence. midpoint of negative p99 (1.3) and positive p5 (20.6); FPR 0.00, TPR 1.00
  memory:
    psi_some_avg10: 10.0   # NOT data-derived: host memory PSI stayed ~0 in every run (no swap ->
                           # kernel OOM-kills instead of stalling). Set well below systemd-oomd's kill limit
                           # (60% for 30s, man oomd.conf) because we must act before a kill.
    available_min_percent: 10.0   # earlyoom's default kill point (-m 10); we treat crossing it as contention.
    container_oom_kill_is_contention: true   # memory.events oom_kill delta > 0 in the window (observed in ram_pressure high).
  persistence_s: 10   # condition must hold this long. Longest run of consecutive
                    # negative seconds above the CPU PSI threshold = 0s; floor = brief's 10s.

classifier:
  window_samples: 5              # design choice (not fitted): 5 s at 1 Hz, half the 10 s trigger persistence
  min_active_cpu_percent: 42   # midpoint of negative p99 (0) and positive p5 (85) (negative = busiest workload class while idle,
                                 # e.g. the IDE language server; positive = the workload's own class in single-workload runs)
  conflict_min_cpu_percent: 87   # midpoint of negative p99 (0) and positive p5 (174) (2nd-largest foreground class: single-workload runs
                                   # vs build_and_test)
  min_dominance: 0.8           # midpoint of negative p99 (0.60) and positive p5 (1.00) (negative = build_and_test, positive = single-workload runs)
  min_persistence: 0.6           # design choice (not fitted): steady runs show persistence p1 = 0.60,
                                 # so it only matters during transitions; 3 of 5 samples active
  unknown_busy_cpu_percent: 209   # midpoint of negative p99 (23) and positive p5 (395) (negative = unattributed CPU in idle/load,
                                   # positive = cpu_pressure hogs, which match no developer-tool signature)

evaluation:
  discrete:
    improved_threshold: 0.90    # new_duration < baseline * 0.90 (-10%)
    degraded_threshold: 1.10    # new_duration > baseline * 1.10 (+10%)
    timeout_factor: 2.5         # abort if build takes > baseline * 2.5
    timeout_min_s: 120
  continuous:
    window_s: 60                # 60s window post-action vs 60s pre-action
    improved_psi_factor: 0.85   # post_psi < pre_psi * 0.85 (-15%)
    degraded_psi_factor: 1.15   # post_psi > pre_psi * 1.15 (+15%)


